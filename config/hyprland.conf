# Minimal Hyprland used purely as the greeter's compositor.
#
# Deliberately bare: no bar, no animations, no keybinds beyond what the
# greeter needs. Hyprland exits when quickshell does, which is what ends
# the greeter after a successful login.

exec-once = qs -p /usr/share/quickgreet/shell.qml; hyprctl dispatch exit

# Match the layouts your users actually type their passwords with.
# The greeter's badge switches between these and shows which is active.
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# The greeter draws its own background, so leave the compositor's blank.
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}
