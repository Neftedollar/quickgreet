# Test configuration: binds vt 7 so it can run alongside whichever display
# manager currently owns vt 1. Nothing system-wide is switched.
#
#   sudo greetd --config /etc/quickgreet/greetd-test.toml
#
# Then reach it with Ctrl+Alt+F7. Authentication is real.

[terminal]
vt = 7

[default_session]
command = "/usr/lib/quickgreet/run-greeter.sh"
user = "greeter"
